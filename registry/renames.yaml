# 章與冊的重導表（spec/01「改名或合併時，要在重導表 old → new 留一行」）。label 層級的搬家在 moves.yaml，這裡只管章與冊。
# atlas.py check：
#   ids    章 id 改名。old 不能再是現存的章；沿著 old → new 一路走下去，終點必須是現存的章（F3.7 → F4.2 → F5.2）。
#   moves  id 不變、搬到另一冊。chapters.yaml 裡 id 前綴和所在冊不同的章，都要在這裡有一列，且 to 等於所在冊。
#   numbering 新章沿用另一冊的編號序列（CA2 接著 CA 編 CA.11 起，MT 的 FA.9 接著 FA 的序列）；這些章沒有搬過冊，
#          但 id 前綴和所在冊不同，所以也要登記，vol 等於所在冊。
#   titles 章名改動（英文正式章名），只供對照與書稿改名；check 只核對 id 存在、new 等於現行章名。
#   volumes 冊名改動；alias 是舊的網站子目錄（books.json 要保留的別名），只是紀錄，check 不讀。
# 每列附 decided 與 spec（決定出處）。


# 英文用詞約定（書稿用英文，spec/00 原則 7；說明見 spec/02「英文用詞約定」）。
# 每組選定 use，其餘寫法列在 avoid。寫法是不分大小寫的整詞比對；* 是詞幹萬用字元，空白可對到換行。
# status: confirmed（agent 依兩本書稿的頻率提案，待作者確認）| confirmed（tools/usage_report.py 列出書稿裡每一處 avoid）
# 頻率見 generated/usage.md（tools/usage_report.py 產生）。2026-10-10 首次統計。

- id: injective
  title: 單射
  status: confirmed
  use: [injective, injection*, injectivity]
  avoid: [is one-to-one, are one-to-one, be one-to-one, not one-to-one, one-one]
  why: >-
    injective 系列 721 次。one-to-one 只禁形容詞用法（is one-to-one 等）：副詞用法（matches it one-to-one with、
    correspond one-to-one to）是正確的英文，定義裡介紹同義詞的「injective (one-to-one)」也保留，讓讀者認得其他書的寫法。
    （2026-10-10 修正：原提案把 one-to-one 整個列為 avoid。）

- id: surjective
  title: 滿射
  status: confirmed
  use: [surjective, surjection*, surjectivity]
  avoid: [is onto, are onto, be onto, not onto]
  review: true
  why: >-
    surjective 系列 521 次。onto 出現 368 次，但絕大多數是介系詞（projection onto a subspace），不能整個禁用；
    只禁用形容詞用法（is onto 等，共 23 次）。

- id: bijective
  title: 雙射
  status: confirmed
  use: [bijective, bijection*]
  avoid: [one-to-one correspondence*]
  why: bijective／bijection 398 次，one-to-one correspondence 1 次。

- id: image
  title: 像
  status: confirmed
  use: [image*]
  avoid: []
  why: >-
    f(X) 一律稱 image（482 次）。range 出現 161 次，幾乎都是別的意思（range over、a range of lines），
    所以不列入 avoid、也不做 lint；只有線代書一處把 range 當成 image 的同義詞，改寫時順手改掉。
    range 不用來指對應域（codomain）。

- id: kernel
  title: 核與零空間
  status: confirmed
  use: [kernel*, null space*]
  avoid: [nullspace*]
  why: >-
    兩個都保留，各有用途，不是變體：kernel 是映射的核（ker T，416 次），null space 是矩陣的零空間（nul A ⊆ Fⁿ，80 次），
    這是線代書 NOTATION.md 的既有約定。nullspace（連寫）0 次，列入 avoid 防止日後出現。

- id: map
  title: 映射與函數
  status: confirmed
  use: [map, maps, linear map*, function, functions]
  avoid: [a mapping, the mapping, mappings, linear mapping*, linear transformation*]
  keep: [spectral mapping theorem, open mapping theorem, riemann mapping theorem, contraction mapping*,
         "re:\\(or \\*\\*linear transformations?\\*\\*\\)"]
  why: >-
    定義裡介紹同義詞的「a linear map (or linear transformation)」保留（keep），理由同 one-to-one。
    map 用於保持結構的映射（linear map 511 次），function 用於集合論與分析的一般函數（1,705 次）；operator 指 V → V 的線性映射。
    名詞 mapping 不用（現況 0 次）；linear transformation 1 次改成 linear map。動名詞 mapping（mapping X onto Y）照常使用，
    固定名稱列在 keep，不受 avoid 影響：spectral mapping theorem、open mapping theorem、Riemann mapping theorem、contraction mapping。
    （2026-10-10 修正：原提案把 mapping 整個列為 avoid，但書稿裡的 21 次全是定理名或動名詞。）

- id: non-prefix
  title: non- 字首
  status: confirmed
  use: [nonnegative, nonzero, nonempty, nonsingular, nontrivial, nondecreasing, nonincreasing, nondegenerate,
        noninvertible, nonpositive, nonmeasurable]
  avoid: ["re:(?<![\\w-])[Nn]on-[a-z][\\w-]*"]
  why: >-
    連寫（2026-10-10 定案）。兩本書已是美式拼寫，美式數學出版（AMS、Chicago）的慣例是 non- 直接連寫；
    原本「美式拼寫＋連字號」是混搭。例外照 Chicago：後面接專有名詞或大寫字時保留連字號（non-Euclidean、
    non-Archimedean、non-Hausdorff），avoid 的規則只抓 non- 後接小寫字母的寫法。書稿現況是 100% 加連字號，
    遷移是純機械替換（spec/06），陳述雜湊先正規化 avoid 寫法再計算，所以不觸發重審（spec/04 圖 3）。

- id: closed-compounds
  title: 連寫的複合詞
  status: confirmed
  use: [codomain*, preimage*, counterexample*]
  avoid: [co-domain*, pre-image*, counter-example*]
  why: 連寫 87／131／67 次，加連字號 0 次。

- id: dimensional
  title: finite-dimensional
  status: confirmed
  use: [finite-dimensional, infinite-dimensional]
  avoid: [finite dimensional, infinite dimensional]
  why: 加連字號 723 次，分寫 0 次；不論修飾名詞或當述語都加連字號。

- id: definite
  title: 正定與半正定
  status: confirmed
  use: [positive definite, positive semidefinite, negative definite, negative semidefinite]
  avoid: [positive-definite, positive semi-definite, positive-semidefinite, negative-definite, negative semi-definite]
  why: 分寫 561 次，其他寫法 0 次。

- id: self-adjoint
  title: 自伴
  status: confirmed
  use: [self-adjoint]
  avoid: [selfadjoint, self adjoint]
  why: self-adjoint 237 次，其他寫法 0 次。

- id: well-defined
  title: well-defined
  status: confirmed
  use: [well-defined, well defined]
  avoid: [is well-defined, are well-defined, be well-defined, been well-defined, a well defined, an well defined,
          the well defined]
  why: >-
    Chicago 規則：放在名詞前加連字號（a well-defined map，36 次），當述語分寫（is well defined，81 次）。
    兩本書已經完全照這條規則，反例 0 次。

- id: iff
  title: if and only if
  status: confirmed
  use: [if and only if]
  avoid: [iff]
  review: true
  why: >-
    if and only if 861 次，iff 80 次。iff 多半出現在 F1 談連接詞本身的地方（an "iff"、iff-introduction），那是在講符號，不是縮寫；
    其餘當縮寫用的改成 if and only if。lint 會把 F1 的用法也列出來，由作者逐處判斷。

- id: plurals
  title: 複數形
  status: confirmed
  use: [zeros, formulas, lemmas, indices]
  avoid: [formulae, lemmata]
  why: >-
    zeros 188 比 zeroes 1，但那一處是動詞（a reflection zeroes a column），所以 zeroes 不列入 avoid；formulas 338 比 formulae 0；lemmas 10 比 lemmata 0；indices 171 比 indexes 2
    （indexes 也可能是動詞，不列入 avoid）。

- id: us-spelling
  title: 美式拼寫
  status: confirmed
  use: [neighborhood*, behavior*, center*, fiber*, color*, favor*, analyze*, labeled, labeling, modeling, modeled,
        canceled, canceling]
  avoid: [neighbourhood*, behaviour*, centre*, fibre*, colour*, favour*, analyse, analysed, analysing, labelled, labelling,
          modelling,
          modelled, cancelled, cancelling]
  why: >-
    兩本書都是美式拼寫：-ize 2,287 次，詞幹相同的 -ise 0 次。例外只有 labelled 1 次（analysis-book）。
    （2026-10-10 修正：原先以 analyse* 比對，把名詞複數 analyses 也算成英式拼寫；只禁動詞形 analyse、analysed、analysing。）

- id: serial-comma
  title: 序列逗號（Oxford comma）
  status: confirmed
  use: ["re:,\\s+(?:and|or)\\s"]
  avoid: ["re:,\\s+(?:[A-Za-z][\\w'’-]*\\s+){1,4}(?:and|or)\\s"]
  review: true
  why: >-
    列舉三項以上時，最後的 and／or 前加逗號（A, B, and C）。2026-10-10 定案：和美式拼寫、non- 連寫一致，
    是美式數學出版（Chicago、AMS）的慣例；數學標題的項目本身常含 and，少了逗號就讀不出邊界
    （Direct and Semidirect Products, and Finite Abelian Groups）。章名由 atlas.py check 機械檢查；
    散文用 regex 分辨不出「A, B and C」是不是列舉（例如 if x, then y and z），所以報告列出候選處，逐處判斷。

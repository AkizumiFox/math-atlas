# 原節點說明：A／R 是「教完時」的目標深度（定義見 spec/03，待確認）。
# 邊：[使用者, 被用者, uses|borrows|revisits|generalizes|specializes, 需要的 A/R（選填）, assessed（選填）]。
# 節點上的 A／R＝教到；邊上的 A／R＝下游需要；uses 邊要滿足「需要 ≤ 教到」（spec/03）。
# 章欄位已改成新章號（分析線以 analysis-book 為準）。atlas.py diff 會檢查每條 uses／borrows
# 在章層級都有硬路徑；一旦書稿有了 crossref，這份檔改由 build 產生。


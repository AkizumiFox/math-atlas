# 資格考目標：每個目標是一組「讀完就算涵蓋該科」的章。必讀集合由 atlas.py stats 以 s 祖先閉包計算。
# items 是考綱條目 → 章的覆蓋矩陣；找不到章的條目寫 gap。reported 是先前對話報告手算的章數（舊章節清單），只供對照。
# 2026-10-25 起（spec/08 §E1）另有：
#   level: undergrad | grad
#   branch_cover:   支線章（例如 HA）覆蓋的部分；不計入必讀閉包，只列在 report
#   deferred_cover: 主線後段的章覆蓋的部分（例如 Apostol 10、15 → MT）；同樣不計入必讀閉包
#   backbone: true  這本書是冊與章序的骨架（目前只有 apostol-ma）：items 依原書章序排列，對應的主線章在讀序上應單調不減
#   deviations:     骨架順序允許的例外，每條附理由

- id: complex
  name: "Complex Analysis (Ahlfors level)"
  name_zh: 複分析（Ahlfors 程度）
  level: grad
  reported: 49
  note: Berkeley prelim、Harvard quals、Princeton generals 的共同科目，以 UCLA／Cambridge 型的第二層為出口。Picard 走 Bloch 路線（CA.14）列入；theta 函數路線（CA.8b）是選讀，不列入。
  chapters: [CA.1, CA.2, CA.3, CA.4, CA.5, CA.6, CA.10, CA.7, CA.12, CA.11, CA.8a, CA.14]
  items:
    - {topic: Cauchy 積分公式、Liouville、最大模, ch: [CA.2]}

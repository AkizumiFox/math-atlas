# 數學領域覆蓋表：把常見的數學科目對到地圖上的章。atlas.py stats 會彙總成 report.md 的「領域覆蓋」一節。
# status: core     主幹已涵蓋到該科的標準入門程度
#         partial  有章節觸及，但不足一門課
#         branch   未涵蓋；若要加，適合做成支線冊（先修已在地圖上）
#         out      不在本套書範圍（應用學門或研究前沿），只在地圖上標出接點
# ch:   涵蓋或觸及的章；hook: 若要開支線冊，它的入口先修（章 id）
# 分組與科目清單取自使用者提供的領域列表（2026-10-09）。
# id: 科目 ID（穩定，供 after 與 registry/field-deviations.yaml 引用）
# after: 科目層的計畫邊：讀這一科之前要先讀完哪些科目（支線之間的先修）。和章層級邊分開存放；
#        入口必讀＝自己的 hook 加上所有 after 科目（遞移）的 ch 與 hook，再取 s 祖先閉包。


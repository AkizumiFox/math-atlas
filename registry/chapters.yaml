# 章（L1）。title 是正式章名（英文，書稿用英文，spec/00 原則 7）；title_zh 是選填的中文章名。
# 每冊內的列表順序就是該冊的章序，必須是冊內 s ∪ b 的一個線性延伸（atlas.py check 會驗）。
# id 穩定、不帶語意；章搬家時 id 跟著走，顯示編號由 build 產生。搬冊之後 id 的前綴可以和所在冊不同（AN2.1 在 AN1），
#   但每一章都要在 registry/renames.yaml 的 moves 有對應的一列（atlas.py check 會驗）。
# src: ab:N       = analysis-book/blueprint/book.yaml 的第 N 章（以該檔為章節內容的單一來源）
#      la:chNN    = linear-algebra 的第 NN 章；la:ch00/NN = 第 0 章第 NN 節
#      new        = 尚無書稿，章名為計畫
# opt: true       = 選讀章；不可被任何 s 邊依賴
# seg: B          = 冊內 B 段（主幹讀者可略過，只被少數下游使用）
# hosted: 冊      = 章屬於本冊，但書稿暫時寄放在另一冊出版（AL4.8 在 la4，spec/08 決策 10）


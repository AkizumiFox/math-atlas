# 章（L1）。每冊內的列表順序就是該冊的章序，必須是冊內 s ∪ b 的一個線性延伸（atlas.py check 會驗）。
# id 穩定、不帶語意；章搬家時 id 跟著走，顯示編號由 build 產生。
# src: ab:N       = analysis-book/blueprint/book.yaml 的第 N 章（以該檔為章節內容的單一來源）
#      la:chNN    = linear-algebra 的第 NN 章；la:ch00/NN = 第 0 章第 NN 節
#      new        = 尚無書稿，章名為計畫
# opt: true       = 選讀章；不可被任何 s 邊依賴
# seg: B          = 冊內 B 段（主幹讀者可略過，只被少數下游使用）


# 章層級「計畫邊」（L1）。格式：目標章: {s: [...], b: [...], see: [...], revisits: [...], why: {來源: 理由}}
#   s        uses：目標章的證明或定義需要讀過來源章（硬邊，進入無環檢查與必讀計算）
#   b        borrows：只把來源章的具名結果當黑盒借用（硬邊，進入無環檢查，不進入必讀計算）；每條 b 都要寫 why
#   see      延伸或動機，可以指向後文（軟邊）
#   revisits 同一概念的更高 A／R 版本（軟邊，方向：新版本 ← 舊版本）
#
# 有書稿的冊，計畫邊之後由 build 的計算邊取代：
#   - 線代（LA1–4、MA、GEO、NLA、F3.6–3.8、AL1.1、AL4.8 的線代部分）的邊已經是計算值，見 computed/la-edges.yaml；
#     這裡只補計算圖看不到的 b 邊（線代書以散文列出的 (A1)–(A7) 類借用事實）。
#   - 分析線的邊依 analysis-book 的 outline 與 external_prerequisites 手寫，待該書的 crossref 完整後改用計算值。
#   - 代數、ST 尚無書稿，邊是設計提案。


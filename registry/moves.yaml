# 計畫中的結果搬家：書稿還沒改之前，匯入計算邊時就先把這些 label 算在新的章。
# 書稿完成搬家後，刪掉對應的列（import_la.py 會警告已經不在原處的列）。
# label: 書稿裡的 label；book: la | ab；from／to: 章 ID；leave: 原處留下的軟邊（see）
# borrowed_by: 搬家後改以 b 借用這個結果的章
# todo: spec/06 的待辦 ID（`todo:<id>`）；書稿改完、勾掉待辦後，這一列必須刪掉，atlas.py check 會檢查
# softened_for: 書稿改寫後只以 see 指向它的章（原本的硬引用不再成立）
# scope: 陳述用到的語彙來自哪些章；每一章都必須是每個 borrowed_by 章的 s 祖先（atlas.py check 的 scope lint）

- label: thm-unitary-exponential
  book: la
  from: LA3.12
  to: AN3.3
  leave: see
  borrowed_by: [MA.21]   # 否則 MA 會被迫讀 AN3
  scope: [LA2.10, LA3.12]   # 矩陣指數、么正群；MA.21 本身就以 s 引用 LA2.10（thm-exponential-properties）
  decided: 2026-10-09
  todo: unitary-exp
  why: >-
    LA3 對 LA2.10 的硬依賴只來自這個定理引用 §10.9 的矩陣指數。不能改成 b：跳過 LA2.10 的讀者，
    作用域裡沒有矩陣指數的記號（b 的合法性規則）。搬到 AN3.3（矩陣指數與流）之後，LA3 可以跳過第 10 章。

